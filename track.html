<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Track Emergency Report</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <!-- Navigation -->
    <header>
        <nav class="navbar">

            <div class="logo">
                🚨 EmergencyReport
            </div>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="report.html">Report Emergency</a></li>
                <li><a href="track.html">Track Report</a></li>
                <li><a href="admin.html">Admin</a></li>
            </ul>

        </nav>
    </header>


    <!-- Track Section -->
    <section class="track-section">

        <div class="track-container">

            <h1>Track Your Report 🔎</h1>

            <p>
                Enter your emergency report ID to check its status.
            </p>

            <div class="track-form">

                <input
                    type="text"
                    id="reportId"
                    placeholder="Example: ER-123456"
                >

                <button onclick="trackReport()">
                    Track Report
                </button>

            </div>

            <!-- Result -->
            <div id="trackResult"></div>

        </div>

    </section>


    <footer>

        <p>
            © 2026 Emergency Reporting System
        </p>

    </footer>


    <script src="/script.js"></script>

</body>

</html>
